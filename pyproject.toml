[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatever2sbom"
dynamic = ["version"]
description = "Generate a rich SBOM for whatever you throw at it"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Michael Hansonis", email = "whatever2sbom@teeque.dev" },
]
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.23",
    "packaging>=24",
]

[project.urls]
Homepage = "https://github.com/teeque87/whatever2sbom"
Documentation = "https://teeque87.github.io/whatever2sbom/"
Repository = "https://github.com/teeque87/whatever2sbom"
Issues = "https://github.com/teeque87/whatever2sbom/issues"

[project.scripts]

whatever2sbom = "whatever2sbom.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-shadcn>=0.10",
    "Pygments>=2.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whatever2sbom" = ["schema/**/*.json"]
# Built-in plugin scripts are shipped as data (builtin/ is intentionally not a
# package) and discovered by name at runtime, not imported as submodules.
"whatever2sbom.plugins" = ["builtin/*.py"]

[tool.setuptools_scm]
# Tags are "v1.2.3"; the leading "v" is stripped to produce the package
# version "1.2.3", which is what ends up in METADATA / PyPI / __version__.
# Untagged commits get a local dev version (e.g. "1.2.4.dev3+gabcdef0").