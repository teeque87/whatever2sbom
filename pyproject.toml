[build-system]
requires = ["setuptools>=68", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatever2sbom"
dynamic = ["version"]
description = "Generate a rich SBOM for whatever you throw at it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]

whatever2sbom = "whatever2sbom.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whatever2sbom" = ["schema/**/*.json"]

[tool.setuptools_scm]
# Tags are "v1.2.3"; the leading "v" is stripped to produce the package
# version "1.2.3", which is what ends up in METADATA / PyPI / __version__.
# Untagged commits get a local dev version (e.g. "1.2.4.dev3+gabcdef0").