[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatever2sbom"
version = "0.1.0"
description = "Generate a rich SBOM for whatever you throw at it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
]

[project.scripts]

whatever2sbom = "whatever2sbom.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "pytest>=8",
    "pytest-cov",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"whatever2sbom" = ["schema/**/*.json"]