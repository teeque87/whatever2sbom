site_name: whatever2sbom
site_description: Generate a rich SBOM for whatever you throw at it
site_url: https://teeque87.github.io/whatever2sbom/
repo_url: https://github.com/teeque87/whatever2sbom
repo_name: teeque87/whatever2sbom
edit_uri: edit/main/docs/

theme:
  name: shadcn
  show_title: true
  show_stargazers: true
  pygments_style:
    light: shadcn-light
    dark: github-dark

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - fenced_code
  - codehilite
  - pymdownx.inlinehilite
  - pymdownx.blocks.tab

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Usage:
      - Getting started: getting-started.md
      - CLI reference: cli-reference.md
      - Systems:
          - Overview: systems/index.md
          - dpkg: systems/dpkg.md
          - npm: systems/npm.md
          - pip: systems/pip.md
      - Output:
          - Schemas: schemas.md
          - Format: output.md
          - Validation: validation.md
      - Performance: performance.md
  - Development:
      - Architecture: architecture.md
      - Extending whatever2sbom: extending.md
      - Plugins: plugins.md
      - Releasing: releasing.md
