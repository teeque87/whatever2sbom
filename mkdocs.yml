site_name: whatever2sbom
site_description: Generate a rich SBOM for whatever you throw at it
site_url: https://teeque87.github.io/whatever2sbom/
repo_url: https://github.com/teeque87/whatever2sbom
repo_name: teeque87/whatever2sbom
edit_uri: edit/main/docs/

theme:
  name: shadcn
  show_title: true
  show_stargazers: true

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - CLI reference: cli-reference.md
  - Systems and schemas: systems.md
  - Output format: output.md
  - Validation: validation.md
  - Architecture: architecture.md
  - Extending whatever2sbom: extending.md
  - Performance: performance.md
  - Releasing: releasing.md
